function getPool(){return DATA.filter(q=>(!E('subject').value||sub(q)===E('subject').value)&&(!E('date').value||q.date===E('date').value)&&(!E('type').value||q.type===E('type').value)&&({all:()=>true,unanswered:()=>!storage.answers[q.id],wrong:()=>!!storage.wrongBook[q.id],fav:()=>!!storage.favs[q.id]}[E('mode').value]()))}
function apply(shuffle){redoId=null;current=getPool();if(shuffle)for(let i=current.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[current[i],current[j]]=[current[j],current[i]]}cursor=0;render()}
function render(){stats();E('pool').textContent=`本次筛选：${current.length} 道`;E('progress').style.width=current.length?`${(cursor+1)/current.length*100}%`:'0%';if(!current.length){E('quiz').innerHTML='<div class="empty">当前筛选条件下暂无题目。试试「全部题目」或切换学科。</div>';return}if(cursor>=current.length)cursor=current.length-1;let q=current[cursor],savedRecord=storage.answers[q.id],record=redoId===q.id?null:savedRecord,parts=q.answers.length;selection=Array.from({length:parts},()=>[]);if(record?.selected)selection=record.selected.map(a=>[...a]);let blocks=Array.from({length:parts},(_,i)=>{let multi=q.answers[i].length>1;return `<div class="subq"><div class="subhead">${parts>1?`第 ${i+1} 小问 · `:''}${multi?'多选（可选择多个）':'单选'} ${record?'· 已提交':''}</div>${q.options.map(o=>`<label class="op ${selection[i].includes(o.key)?'on':''}" data-part="${i}" data-option="${o.key}"><input type="${multi?'checkbox':'radio'}" name="part${i}" value="${o.key}" ${selection[i].includes(o.key)?'checked':''} ${record?'disabled':''}><b>${o.key}</b><span>${safe(o.text)}</span></label>`).join('')}</div>`}).join('');E('quiz').innerHTML=`<div class="qmeta"><span class="tag subject">${safe(sub(q))}</span><span class="tag">学成选择题</span><span class="tag">${safe(q.date)}</span><span class="tag">原第 ${q.original} 题</span><span class="tag">${q.type}</span>${q.category_confidence!=='高'?'<span class="tag note">学科归类可修正</span>':''}<span class="count">${cursor+1} / ${current.length}</span></div><div class="qtitle">${safe(q.stem)}</div>${blocks}<div id="feedback"></div><div class="qfooter"><button class="btn primary" id="submit" ${record?'disabled':''}>提交答案</button><button class="btn" id="redo" ${record?'':'disabled'}>↻ 重新作答</button><button class="btn" id="wrongToggle">${storage.wrongBook[q.id]?'移出错题本':'加入错题本'}</button><button class="btn" id="previous" ${cursor===0?'disabled':''}>上一题</button><button class="btn" id="next" ${cursor===current.length-1?'disabled':''}>下一题</button><button class="btn" id="fav">${storage.favs[q.id]?'★ 已收藏':'☆ 收藏本题'}</button></div><div class="classify"><label for="fixSubject">学科归类（可修改）</label><select id="fixSubject">${subjects.map(s=>`<option ${sub(q)===s?'selected':''}>${s}</option>`).join('')}</select><span class="status" id="classStatus"></span></div>`;
E('redo').onclick=()=>{redoId=q.id;render()};E('wrongToggle').onclick=()=>{if(storage.wrongBook[q.id])delete storage.wrongBook[q.id];else storage.wrongBook[q.id]=true;save();if(E('mode').value==='wrong'&&!storage.wrongBook[q.id]){current=getPool();cursor=Math.min(cursor,Math.max(0,current.length-1));redoId=null}render()};E('previous').onclick=()=>{redoId=null;cursor--;render();window.scrollTo({top:0,behavior:'smooth'})};E('next').onclick=()=>{redoId=null;cursor++;render();window.scrollTo({top:0,behavior:'smooth'})};E('fav').onclick=()=>{if(storage.favs[q.id])delete storage.favs[q.id];else storage.favs[q.id]=true;save();render()};E('fixSubject').onchange=()=>{storage.subjectOverrides[q.id]=E('fixSubject').value;save();E('classStatus').textContent='已保存';stats()};
if(!record){document.querySelectorAll('.op').forEach(el=>{el.addEventListener('click',(event)=>{event.preventDefault();let i=Number(el.dataset.part),a=el.dataset.option,multi=q.answers[i].length>1;if(multi){if(selection[i].includes(a))selection[i]=selection[i].filter(x=>x!==a);else selection[i].push(a)}else selection[i]=[a];document.querySelectorAll(`.op[data-part="${i}"]`).forEach(node=>{let yes=selection[i].includes(node.dataset.option);node.classList.toggle('on',yes);node.querySelector('input').checked=yes})})});E('submit').onclick=()=>{if(selection.some(a=>a.length===0)){alert('请完成全部小问后提交');return}let ok=q.answers.every((a,i)=>[...a].sort().join('')===[...selection[i]].sort().join(''));storage.answers[q.id]={correct:ok,selected:selection.map(a=>[...a]),at:Date.now()};if(!ok)storage.wrongBook[q.id]=true;redoId=null;save();render()}}else{let f=E('feedback');f.className='feedback '+(record.correct?'good':'bad');f.innerHTML=`<b>${record.correct?'✓ 回答正确':'✕ 回答错误'}</b><div>参考答案：${q.answers.map((a,i)=>`${parts>1?`第${i+1}问 `:''}${safe(a)}`).join('；')}</div><div>你的答案：${(record.selected||[]).map((a,i)=>`${parts>1?`第${i+1}问 `:''}${safe(a.join(''))||'未选'}`).join('；')}</div>`}}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
